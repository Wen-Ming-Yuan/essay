<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="atlas-body">
  <header class="atlas-header">
    <h1>PaperPrism Atlas</h1>
    <div class="atlas-legend">
      <span><i class="dot star"></i> 你的论文</span>
      <span><i class="dot feed"></i> arXiv 订阅</span>
      <span><i class="dot ccf"></i> CCF A类</span>
    </div>
    <button id="btnBack" class="btn btn-ghost">返回仪表板</button>
  </header>
  <canvas id="atlasCanvas"></canvas>
  <div id="atlasTooltip" class="atlas-tooltip" style="display:none;"></div>
  <script src="js/atlas-embed.js"></script>
  <script src="js/storage.js"></script>
  <script src="atlas.js"></script>
</body>
</html>
